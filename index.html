<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scholars Abroad – Ivy Profile Builder</title>
<meta name="description" content="Build a strong profile for Ivy League admissions. Grade 8 to UG.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F7; --card:#FFFFFF; --ink:#13222F; --muted:#55626D; --border:#E3E7EB;
  --primary:#1D5A47; --primary-dk:#164536; --tint:#E2F0EA;
  --reach-bg:#E3ECF8; --reach-fg:#1F4E8C; --high-bg:#FBEFD9; --high-fg:#8A4F08;
  --weak:#B8741A; --r:18px; --focus:2px solid var(--primary);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit;margin:0}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--primary)}
h1,h2,h3,h4,p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
:focus-visible{outline:var(--focus);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{width:22px;height:22px;flex:none;display:block}
.ic-sm{width:18px;height:18px}
.ic-lg{width:26px;height:26px}

/* ---------- shell ---------- */
.shell{min-height:100vh;display:flex;flex-direction:column}
.main{flex:1;width:100%;padding-bottom:96px}
.content{max-width:1200px;margin:0 auto;padding:20px 16px 40px}
.sidebar{display:none}
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;
  border-top:1px solid var(--border);display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tabbar a{
  flex:1;min-width:0;min-height:52px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;
  font-size:10.5px;font-weight:700;letter-spacing:.01em;color:var(--muted);
  text-decoration:none;border-radius:12px;transition:color .15s,background .15s;
}
.tabbar a[aria-current="page"]{color:var(--primary);background:var(--tint)}
@media (min-width:768px){
  .tabbar{display:none}
  .main{margin-left:236px;padding-bottom:0}
  .content{padding:32px 32px 64px}
  .sidebar{
    display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;width:236px;
    background:#fff;border-right:1px solid var(--border);padding:22px 14px;z-index:30;gap:4px;
  }
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;text-decoration:none;color:var(--ink)}
.brand-mark{
  width:34px;height:34px;border-radius:10px;background:var(--primary);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;
}
.brand b{display:block;font-size:14.5px;font-weight:800;line-height:1.15}
.brand span{display:block;font-size:11px;color:var(--muted);font-weight:600}
.nav-link{
  display:flex;align-items:center;gap:11px;min-height:46px;padding:0 12px;border-radius:12px;
  text-decoration:none;color:var(--muted);font-weight:700;font-size:14.5px;transition:background .15s,color .15s;
}
.nav-link:hover{background:var(--bg);color:var(--ink)}
.nav-link[aria-current="page"]{background:var(--tint);color:var(--primary)}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--border)}
.side-foot p{font-size:12px;color:var(--muted);line-height:1.45}

/* ---------- primitives ---------- */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:20px;
}
.card-tap{display:block;width:100%;text-align:left;transition:border-color .15s,background .15s}
.card-tap:hover{border-color:#cfd6dc}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.h2{font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.3}
.h3{font-size:16px;font-weight:700;line-height:1.35}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-lg{display:flex;flex-direction:column;gap:22px}
.row{display:flex;align-items:center;gap:12px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.page-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:20px}
.page-head .grow{flex:1;min-width:0}
.grid-2{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:900px){.grid-2{grid-template-columns:1fr 1fr}}
@media (min-width:1000px){.grid-home{grid-template-columns:360px 1fr;align-items:start}}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:11px 22px;border-radius:999px;font-weight:700;font-size:15px;
  border:1.5px solid transparent;text-decoration:none;transition:background .15s,border-color .15s,color .15s;
}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dk)}
.btn-ghost{background:#fff;border-color:var(--border);color:var(--ink)}
.btn-ghost:hover{border-color:#c9d1d8;background:#fafbfb}
.btn-soft{background:var(--tint);color:var(--primary)}
.btn-soft:hover{background:#d4e8de}
.btn-danger{background:#fff;border-color:#E7C9C9;color:#9B2C2C}
.btn-danger:hover{background:#FDF4F4}
.btn-block{width:100%}
.btn-sm{min-height:40px;padding:8px 16px;font-size:14px}
.icon-btn{
  width:44px;height:44px;display:grid;place-items:center;border-radius:12px;
  color:var(--muted);transition:background .15s,color .15s;
}
.icon-btn:hover{background:var(--bg);color:var(--ink)}
.link-btn{
  display:inline-flex;align-items:center;gap:6px;min-height:44px;
  font-weight:700;font-size:14.5px;color:var(--primary);text-decoration:none;
}
.link-btn:hover{text-decoration:underline}

.chip{
  display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:999px;
  font-size:12.5px;font-weight:700;white-space:nowrap;
}
.chip-reach{background:var(--reach-bg);color:var(--reach-fg)}
.chip-high{background:var(--high-bg);color:var(--high-fg)}
.chip-soft{background:var(--tint);color:var(--primary)}
.chip-grey{background:#ECEFF1;color:var(--muted)}
.chip-points{background:var(--tint);color:var(--primary);font-weight:800}
.chip-na{background:#ECEFF1;color:var(--muted)}

.seg{display:flex;gap:4px;background:#E9EDEF;border-radius:999px;padding:4px}
.seg button{
  flex:1;min-height:44px;padding:8px 12px;border-radius:999px;font-weight:700;font-size:14px;
  color:var(--muted);transition:background .15s,color .15s,box-shadow .15s;
}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(19,34,47,.1)}

.bar{height:9px;background:#EBEEF0;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:inherit;transition:width .2s ease}
.bar.weak i{background:var(--weak)}
.bar-row{display:flex;flex-direction:column;gap:6px}
.bar-label{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700}
.bar-label span:last-child{color:var(--muted);font-weight:700}

.dots{display:flex;gap:5px}
.dots i{width:11px;height:11px;border-radius:50%;background:#DDE2E6;display:block}
.dots i.on{background:var(--primary)}

.progress{height:9px;background:#E7EAEC;border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--primary);border-radius:inherit;transition:width .2s}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field > label,.label{font-size:13.5px;font-weight:700}
.input,.select,.textarea{
  width:100%;min-height:48px;background:#fff;border:1.5px solid var(--border);
  border-radius:13px;padding:11px 14px;font-size:15.5px;transition:border-color .15s;
}
.textarea{min-height:96px;resize:vertical;line-height:1.5}
.input:hover,.select:hover,.textarea:hover{border-color:#cfd6dc}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(29,90,71,.14)}
.input.bad,.textarea.bad,.select.bad{border-color:#C0392B}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:12.5px;color:#A61B1B;font-weight:600}
.counter{text-align:right;font-size:12px;color:var(--muted);font-weight:600}
.counter.over{color:#A61B1B}
.chip-row{display:flex;flex-wrap:wrap;gap:9px}
.chip-btn{
  min-height:44px;padding:9px 17px;border-radius:999px;border:1.5px solid var(--border);
  background:#fff;font-size:14.5px;font-weight:700;color:var(--ink);
  display:inline-flex;align-items:center;gap:7px;transition:.15s;
}
.chip-btn:hover{border-color:#c2cbd2}
.chip-btn[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.tile{
  min-height:66px;border-radius:16px;border:1.5px solid var(--border);background:#fff;
  font-size:20px;font-weight:800;color:var(--ink);transition:.15s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
}
.tile small{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tile:hover{border-color:#c2cbd2}
.tile[aria-pressed="true"]{border-color:var(--primary);background:var(--tint);color:var(--primary)}
.tile[aria-pressed="true"] small{color:var(--primary)}
.seg-field{display:flex;flex-direction:column;gap:7px}
.consent{
  display:flex;gap:11px;align-items:flex-start;background:var(--tint);border-radius:14px;
  padding:14px 16px;font-size:13.5px;line-height:1.5;color:#14453A;font-weight:600;
}
.consent input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--primary)}

/* ---------- onboarding ---------- */
.ob{max-width:640px;margin:0 auto;padding:24px 16px 60px}
.ob-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.ob-logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:14.5px}
.ob-steps{display:flex;gap:6px;margin-bottom:22px}
.ob-steps i{height:7px;flex:1;background:#E2E6E9;border-radius:999px;transition:background .2s}
.ob-steps i.on{background:var(--primary)}
.tip{
  background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 16px;
  font-size:14px;line-height:1.55;color:var(--muted);
}
.tip b{color:var(--ink)}

/* ---------- home ---------- */
.hello{margin-bottom:4px}
.ring-wrap{position:relative;width:196px;height:196px;margin:6px auto 2px}
.ring-wrap svg{width:100%;height:100%;display:block}
.ring-center{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
}
.ring-score{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ring-score sub{font-size:15px;font-weight:700;color:var(--muted);vertical-align:baseline}
.ring-status{font-size:13px;font-weight:800;color:var(--primary);margin-top:5px}
.ring-note{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
.move-card{background:var(--primary);color:#fff;border:none;border-radius:20px;padding:22px}
.move-card .eyebrow{color:#9FD3C0}
.move-card h3{font-size:20px;font-weight:800;line-height:1.3;margin-top:8px;letter-spacing:-.01em}
.move-card p{font-size:14px;color:#CBE4DA;margin-top:8px;line-height:1.55}
.move-card .move-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.move-card .chip{background:rgba(255,255,255,.16);color:#EAF6F1}
.move-actions{display:flex;gap:10px;margin-top:18px}
.move-actions .btn{flex:1}
.move-actions .btn-white{background:#fff;color:var(--primary)}
.move-actions .btn-white:hover{background:#EDF6F2}
.move-actions .btn-outline{border-color:rgba(255,255,255,.5);color:#fff}
.move-actions .btn-outline:hover{background:rgba(255,255,255,.12)}
.target-card{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:15px 18px;
  background:#fff;border:1px solid var(--border);border-radius:16px;
  text-decoration:none;color:var(--ink);transition:border-color .15s;
}
.target-card:hover{border-color:#c9d1d8}
.target-rank{font-size:13px;font-weight:800;color:var(--muted);width:18px;flex:none}
.target-name{display:block;font-weight:800;font-size:15.5px}
.target-card .uni-sub{display:block}
.badge-change{
  display:inline-flex;align-items:center;gap:5px;background:var(--tint);color:var(--primary);
  font-size:12.5px;font-weight:800;padding:5px 11px;border-radius:999px;
}

/* ---------- profile ---------- */
.pillar-card{display:flex;flex-direction:column;gap:12px}
.pillar-icon{
  width:42px;height:42px;border-radius:13px;background:var(--tint);color:var(--primary);
  display:grid;place-items:center;flex:none;
}
.pillar-top{display:flex;align-items:center;gap:13px}
.pct{font-size:22px;font-weight:800;letter-spacing:-.02em}
.entry-item{display:flex;gap:13px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--border)}
.entry-item:last-child{border-bottom:none;padding-bottom:0}
.entry-item:first-child{padding-top:0}
.entry-main{flex:1;min-width:0}
.entry-main h4{font-size:15.5px;font-weight:800}
.entry-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.entry-actions{display:flex;gap:2px;flex:none}
.fab{
  position:fixed;right:84px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:35;
  min-height:52px;padding:0 22px;border-radius:999px;background:var(--primary);color:#fff;
  font-weight:800;font-size:15px;display:inline-flex;align-items:center;gap:8px;
  box-shadow:0 6px 20px rgba(19,34,47,.18);transition:background .15s,transform .15s;
}
.fab:hover{background:var(--primary-dk)}
.fab:active{transform:scale(.98)}
@media (min-width:768px){.fab{bottom:26px;right:26px}}

/* ---------- empty ---------- */
.empty{
  text-align:center;padding:34px 22px;border:1.5px dashed #D4DADF;border-radius:var(--r);
  background:#FBFCFC;
}
.empty .pillar-icon{margin:0 auto 13px}
.empty h4{font-size:16.5px;font-weight:800}
.empty p{font-size:14px;color:var(--muted);margin-top:7px;line-height:1.55;max-width:380px;margin-left:auto;margin-right:auto}
.empty .btn{margin-top:16px}

/* ---------- chances ---------- */
.uni-row{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:15px 17px;
  background:#fff;border:1px solid var(--border);border-radius:16px;
  text-decoration:none;color:var(--ink);transition:border-color .15s;
}
.uni-row:hover{border-color:#c9d1d8}
.uni-rank{
  width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center;
  font-size:13px;font-weight:800;color:var(--muted);flex:none;
}
.uni-main{flex:1;min-width:0}
.uni-main h4{font-size:15.5px;font-weight:800;color:var(--ink)}
.uni-sub{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:3px}
.disclaimer{
  background:#fff;border:1px solid var(--border);border-left:4px solid var(--weak);
  border-radius:14px;padding:15px 17px;font-size:13.5px;line-height:1.6;color:var(--muted);
}
.disclaimer b{color:var(--ink)}
.honest-list{display:flex;flex-direction:column;gap:9px}
.honest-list li{display:flex;gap:10px;font-size:14px;line-height:1.5;color:var(--muted)}
.honest-list li svg{color:var(--weak);margin-top:2px}
.act-item{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 16px;
  background:#fff;border:1px solid var(--border);border-radius:14px;font-weight:700;font-size:14.5px;
  min-height:56px;text-decoration:none;color:var(--ink);
  transition:border-color .15s,background .15s;
}
.act-item:hover{border-color:var(--primary);background:#F7FBF9}
.act-item .grow{flex:1;min-width:0}
.why-card{background:var(--tint);border:none;border-radius:16px;padding:18px}
.why-card h4{font-size:15px;font-weight:800;color:#14453A}
.why-card p{font-size:14px;color:#26564A;margin-top:7px;line-height:1.6}

/* ---------- roadmap ---------- */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  min-height:44px;padding:9px 17px;border-radius:999px;border:1.5px solid var(--border);
  background:#fff;font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap;transition:.15s;
}
.tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.task{
  display:flex;gap:13px;align-items:flex-start;padding:16px;background:#fff;
  border:1px solid var(--border);border-radius:16px;transition:.15s;
}
.task.done{background:#FAFBFB;opacity:.72}
.task-check{
  width:26px;height:26px;border-radius:50%;border:2px solid #C6CDD3;flex:none;margin-top:2px;
  display:grid;place-items:center;color:transparent;transition:.15s;background:#fff;
}
.task.done .task-check{background:var(--primary);border-color:var(--primary);color:#fff}
.task-body{flex:1;min-width:0}
.task-body h4{font-size:15px;font-weight:800;line-height:1.4}
.task.done .task-body h4{text-decoration:line-through;color:var(--muted)}
.task-meta{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:9px}
.task-toggle{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left}

/* ---------- settings ---------- */
.danger-zone{border-color:#EAD5D5}
.danger-zone h3{color:#9B2C2C}

/* ---------- toast / modal ---------- */
#toast-host{position:fixed;top:14px;left:0;right:0;z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}
.toast{
  background:var(--ink);color:#fff;font-size:14.5px;font-weight:700;padding:13px 20px;
  border-radius:999px;box-shadow:0 8px 24px rgba(19,34,47,.25);max-width:560px;text-align:center;
  animation:toast-in .18s ease;
}
@keyframes toast-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.modal-backdrop{
  position:fixed;inset:0;background:rgba(19,34,47,.5);z-index:70;display:grid;place-items:center;
  padding:18px;animation:fade .15s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:#fff;border-radius:20px;padding:24px;width:100%;max-width:460px;
  max-height:88vh;overflow:auto;animation:pop .16s ease;
}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.modal h3{font-size:19px;font-weight:800}
.modal .stack{margin-top:16px}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-actions .btn{flex:1}

/* ---------- impact box ---------- */
.impact{
  background:var(--tint);border-radius:16px;padding:16px 18px;
}
.impact h4{font-size:13px;font-weight:800;color:#14453A;text-transform:uppercase;letter-spacing:.05em}
.impact-main{font-size:17px;font-weight:800;color:#14453A;margin-top:8px;line-height:1.4}
.impact-sub{font-size:13px;color:#3B6B5D;margin-top:6px;line-height:1.5}

.strength-list li,.gap-list li{
  display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.5;padding:7px 0;
}
.strength-list li svg{color:var(--primary);flex:none;margin-top:2px}
.gap-list li svg{color:var(--weak);flex:none;margin-top:2px}
.divider{height:1px;background:var(--border);margin:4px 0}

/* ---------- live dates & live data ---------- */
.date-list li{display:flex;gap:13px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.date-list li:last-child{border-bottom:none;padding-bottom:0}
.date-list li:first-child{padding-top:0}
.date-badge{
  width:54px;flex:none;text-align:center;background:var(--bg);border:1px solid var(--border);
  border-radius:12px;padding:6px 0;line-height:1.15;
}
.date-badge b{display:block;font-size:16px;font-weight:800}

/* ------------------------------------------------------------
   STORAGE — everything wrapped in try/catch. If localStorage is
   blocked the app still runs in memory for this session.
   ------------------------------------------------------------ */
var STORAGE_KEY = "scholarsAbroad.v1";
var memoryStore = {};
var storageOK = true;

function storeGet(key){
  try { return window.localStorage.getItem(key); }
  catch (e) { storageOK = false; return memoryStore[key] || null; }
}
function storeSet(key, val){
  try { window.localStorage.setItem(key, val); }
  catch (e) { storageOK = false; memoryStore[key] = val; }
}
function storeDel(key){
  try { window.localStorage.removeItem(key); }
  catch (e) { delete memoryStore[key]; }
}

function defaultState(){
  return {
    onboarded: false,
    consent: false,
    student: {
      name: "", grade: "10", major: "",
      scale: "percentage", current: "", previous: "",
      sat: "", act: "", ib: "", ap: "",
      rigourTaken: "", rigourOffered: ""
    },
    academics: { current:"", scale:"percentage", previous:"", rigourTaken:"", rigourOffered:"" },
    entries: [],
    roadmapDone: {},
    deferredMove: null,
    history: [],
    draft: null,
    obStep: 1,
    seenDemoHint: false
  };
}

var state = defaultState();

function loadState(){
  var raw = storeGet(STORAGE_KEY);
  if (!raw) return;
  try {
    var parsed = JSON.parse(raw);
    if (parsed && typeof parsed === "object"){
      var base = defaultState();
      for (var k in base) if (!(k in parsed)) parsed[k] = base[k];
      parsed.student = Object.assign(base.student, parsed.student || {});
      parsed.academics = Object.assign(base.academics, parsed.academics || {});
      if (!Array.isArray(parsed.entries)) parsed.entries = [];
      if (typeof parsed.roadmapDone !== "object" || !parsed.roadmapDone) parsed.roadmapDone = {};
      if (!Array.isArray(parsed.history)) parsed.history = [];
      state = parsed;
    }
  } catch (e) { state = defaultState(); }
}

function saveState(){
  try { storeSet(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { /* quota or serialization — keep running in memory */ }
}

function uid(){ return "e" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
/* ------------------------------------------------------------
   LAYER 1 — score one achievement entry
   entry_points = base × level × result × role × commitment × recency × proof
   ------------------------------------------------------------ */
function commitmentFactor(hoursPerWeek, weeksPerYear){
  var annual = (Number(hoursPerWeek) || 0) * (Number(weeksPerYear) || 0);
  if (annual <= 0) return 0.5;
  return Math.min(1.5, 0.5 + Math.log10(1 + annual) / 3);
}

function entryRecency(entry){
  var d = entry.endDate || entry.startDate;
  if (!d) return CONFIG.recencyRecent;
  var t = new Date(d).getTime();
  if (isNaN(t)) return CONFIG.recencyRecent;
  var twoYears = 2 * 365 * 24 * 3600 * 1000;
  return (Date.now() - t) <= twoYears ? CONFIG.recencyRecent : CONFIG.recencyOld;
}

/* Types where the form actually asks "how did it go?" — result only
   multiplies these, so a club or job can never be silently penalised. */
var RESULT_TYPES = ["competition", "research", "project"];

function entryPoints(entry){
  var base = CONFIG.entryBase[entry.type] || 6;
  var level = CONFIG.levelMult[entry.level] || 1;
  var result = RESULT_TYPES.indexOf(entry.type) !== -1
    ? (CONFIG.resultMult[entry.result] || 1) : 1;
  var role = CONFIG.roleMult[entry.role] || 1;
  var commit = commitmentFactor(entry.hoursPerWeek, entry.weeksPerYear);
  var recency = entryRecency(entry);
  var proof = entry.proofFile ? CONFIG.proofMult : 1;
  return base * level * result * role * commit * recency * proof;
}

function entriesForPillar(pillar, list){
  list = list || state.entries;
  if (pillar === "academics" || pillar === "tests"){
    return list.filter(function(e){
      var m = CONFIG.typeMeta[e.type];
      return m && m.pillar === pillar;
    });
  }
  return list.filter(function(e){
    var m = CONFIG.typeMeta[e.type];
    return m && m.pillar === pillar;
  });
}

/* Diminishing returns: best entry counts fully, each next 60% of the one before. */
function diminishingScore(list, benchmark){
  var pts = list.map(entryPoints).sort(function(a,b){ return b - a; });
  var raw = 0;
  for (var i = 0; i < pts.length; i++) raw += pts[i] * Math.pow(0.6, i);
  if (benchmark <= 0) return 0;
  return Math.min(100, (raw / benchmark) * 100);
}

/* ------------------------------------------------------------
   LAYER 2 — pillar scores
   ------------------------------------------------------------ */
function normaliseGrade(value, scale){
  var v = parseFloat(value);
  if (isNaN(v)) return null;
  if (scale === "gpa4") return Math.max(0, Math.min(100, (v / 4) * 100));
  if (scale === "ib")   return Math.max(0, Math.min(100, (v / 45) * 100));
  if (scale === "cbse" || scale === "icse"){
    for (var i = 0; i < CONFIG.cbseTable.length; i++){
      if (v >= CONFIG.cbseTable[i].min) return CONFIG.cbseTable[i].out;
    }
    return 55;
  }
  return Math.max(0, Math.min(100, v)); // percentage
}

function academicsScore(listOverride){
  var a = state.academics || {};
  var grades = normaliseGrade(a.current, a.scale || "percentage");
  if (grades === null) return null;
  var w = CONFIG.acadWeights;

  var rigour = CONFIG.neutralRigour;
  var taken = parseFloat(a.rigourTaken), offered = parseFloat(a.rigourOffered);
  if (!isNaN(taken) && !isNaN(offered) && offered > 0){
    rigour = Math.max(0, Math.min(100, (taken / offered) * 100));
  }
  // Logged courses count toward rigour too — take whichever signal is stronger
  var courseList = entriesForPillar("academics", listOverride || state.entries);
  if (courseList.length){
    var scale = CONFIG.gradeScale[state.student.grade] || 0.6;
    var courseScore = diminishingScore(courseList, 12 * scale);
    if (courseScore > rigour) rigour = courseScore;
  }

  var trend = CONFIG.neutralTrend;
  var prev = parseFloat(a.previous);
  if (!isNaN(prev) && a.scale){
    var prevN = normaliseGrade(prev, a.scale);
    if (prevN !== null){
      trend = Math.max(0, Math.min(100, 50 + (grades - prevN) * 5));
    }
  }

  return grades * w.grades + rigour * w.rigour + trend * w.trend;
}

function testPercentile(entry){
  var testName = (entry.testName || "SAT").toUpperCase();
  var score = parseFloat(entry.scoreValue);
  if (isNaN(score)) return null;
  var range = CONFIG.testRange[testName] || CONFIG.testRange.SAT;
  return Math.max(0, Math.min(100, ((score - range.min) / (range.max - range.min)) * 100));
}

/* Tests pillar: superscore across attempts; null = "not yet". */
function testsScore(){
  var list = entriesForPillar("tests");
  var best = null;
  list.forEach(function(e){
    var p = testPercentile(e);
    if (p !== null && (best === null || p > best)) best = p;
  });
  return best;
}

function benchmarkFor(pillar){
  var scale = CONFIG.gradeScale[state.student.grade] || 0.6;
  var base = CONFIG.baseBenchmarks[pillar];
  return base ? base * scale : null;
}

function computePillars(){
  var out = {};
  out.academics = academicsScore();
  out.tests = testsScore();
  out.activities = diminishingScore(entriesForPillar("activities"), benchmarkFor("activities"));
  out.awards = diminishingScore(entriesForPillar("awards"), benchmarkFor("awards"));
  out.projects = diminishingScore(entriesForPillar("projects"), benchmarkFor("projects"));
  return out;
}

/* ------------------------------------------------------------
   LAYER 3–4 — weights by grade, then overall strength
   strength = Σ(score × weight) + spike bonus + theme bonus
   ------------------------------------------------------------ */
function pillarWeights(){
  var grade = state.student.grade;
  var w = {
    academics: CONFIG.baseWeights.academics,
    activities: CONFIG.baseWeights.activities,
    awards: CONFIG.baseWeights.awards,
    projects: CONFIG.baseWeights.projects,
    tests: CONFIG.testWeightByGrade[grade] != null ? CONFIG.testWeightByGrade[grade] : 0.15
  };
  // No test data yet → spread that weight across the other pillars
  if (testsScore() === null) w.tests = 0;
  var sum = w.academics + w.activities + w.awards + w.projects + w.tests;
  if (sum <= 0) return CONFIG.baseWeights;
  var out = {};
  for (var k in w) out[k] = w[k] / sum;
  return out;
}

function themeBonus(pillarMap){
  var themed = 0, total = 0;
  state.entries.forEach(function(e){
    var m = CONFIG.typeMeta[e.type];
    if (!m) return;
    if (m.pillar === "tests" || m.pillar === "academics") return;
    total++;
    if (e.themed) themed++;
  });
  if (total < 2) return 0;
  var share = themed / total;
  if (share < 0.6) return 0;
  return CONFIG.themeMax * Math.min(1, (share - 0.6) / 0.4 + 0.55);
}

function statusLabel(score){
  var label = CONFIG.statusLabels[0].label;
  CONFIG.statusLabels.forEach(function(s){ if (score >= s.min) label = s.label; });
  return label;
}

function computeStrength(){
  var pillars = computePillars();
  var weights = pillarWeights();
  var scored = [], total = 0, used = 0;
  CONFIG.pillarOrder.forEach(function(p){
    var s = pillars[p];
    if (s === null || s === undefined) return;
    total += s * weights[p];
    used += weights[p];
    scored.push(s);
  });
  if (used > 0 && used < 1) total = total / used; // safety renormalise

  // Spike bonus only counts when at least two pillars are genuinely built —
  // a lone non-zero pillar is an empty profile, not a spike.
  var spike = 0;
  var built = scored.filter(function(s){ return s > 5; });
  if (built.length >= 2){
    var best = Math.max.apply(null, built);
    var avg = built.reduce(function(a,b){ return a + b; }, 0) / built.length;
    spike = Math.max(0, Math.min(CONFIG.spikeMax, (best - avg - CONFIG.spikeGap) * CONFIG.spikeRate));
  }
  var theme = themeBonus(pillars);
  var score = Math.max(0, Math.min(100, total + spike + theme));

  return {
    score: Math.round(score),
    pillars: pillars,
    weights: weights,
    spike: Math.round(spike),
    theme: Math.round(theme),
    label: statusLabel(Math.round(score))
  };
}

/* ------------------------------------------------------------
   LAYER 5–6 — per-university fit, bands, ranking
   fit = Σ(pillar × emphasis) × majorFactor  → 1..5
   fit 4–5 = Reach, 1–3 = High reach. Never "Likely"/"Safety".
   ------------------------------------------------------------ */
function emphasisFor(uni, pillars){
  // If a pillar is "not yet" (tests), spread its emphasis over the rest
  var eff = {}, spread = 0, kept = 0;
  CONFIG.pillarOrder.forEach(function(p){
    var e = uni.emphasis[p] || 0;
    var has = pillars[p] !== null && pillars[p] !== undefined;
    if (has){ eff[p] = e; kept += e; }
    else { eff[p] = 0; spread += e; }
  });
  if (kept <= 0) return eff;
  var give = spread / kept;
  CONFIG.pillarOrder.forEach(function(p){ if (eff[p] > 0) eff[p] = eff[p] * (1 + give); });
  return eff;
}

function fitRaw(pillars, uni){
  var eff = emphasisFor(uni, pillars);
  var raw = 0;
  CONFIG.pillarOrder.forEach(function(p){
    var s = pillars[p];
    if (s === null || s === undefined) return;
    raw += s * eff[p];
  });
  return raw * (uni.majorFactor || 1);
}

function fitToBandNumber(raw){
  var t = CONFIG.fitThresholds;
  if (raw < t[0]) return 1;
  if (raw < t[1]) return 2;
  if (raw < t[2]) return 3;
  if (raw < t[3]) return 4;
  return 5;
}

function bandFor(fit){
  return fit >= 4 ? "Reach" : "High reach";
}

function bandChip(fit){
  var band = bandFor(fit);
  var cls = band === "Reach" ? "chip-reach" : "chip-high";
  return '<span class="chip ' + cls + '">' + band + "</span>";
}

function biggestLever(pillars, uni){
  var eff = emphasisFor(uni, pillars);
  var room = CONFIG.gradeRoom[state.student.grade] || 20;
  var best = null;
  CONFIG.pillarOrder.forEach(function(p){
    var s = pillars[p];
    if (s === null || s === undefined) return;
    var gain = Math.min(100 - s, room);
    if (gain <= 0) return;
    var delta = (eff[p] || 0) * gain * (uni.majorFactor || 1);
    if (!best || delta > best.delta) best = { pillar: p, delta: delta, gain: gain };
  });
  return best;
}

function computeUniversities(){
  var profile = computeStrength();
  var rows = CONFIG.universities.map(function(uni){
    var raw = fitRaw(profile.pillars, uni);
    var fit = fitToBandNumber(raw);
    var lever = biggestLever(profile.pillars, uni);
    return {
      id: uni.id, uni: uni, name: uni.name,
      raw: Math.round(raw * 10) / 10,
      fit: fit, band: bandFor(fit),
      lever: lever ? lever.pillar : null,
      leverGain: lever ? lever.gain : 0
    };
  });
  rows.sort(function(a, b){
    if (b.fit !== a.fit) return b.fit - a.fit;
    if (b.raw !== a.raw) return b.raw - a.raw;
    return (b.leverGain || 0) - (a.leverGain || 0);
  });
  rows.forEach(function(r, i){ r.rank = i + 1; });
  return rows;
}

var PERIODS = [
  { id:"this-term", label:"This term" },
  { id:"summer", label:"Summer" },
  { id:"next-grade", label:"Next grade" },
  { id:"application-year", label:"Application year" }
];

function periodUrgency(periodId){
  if (periodId === "this-term") return 1.5;
  if (periodId === "summer") return 1.2;
  if (periodId === "next-grade") return 1.0;
  return 0.9;
}

function generateRoadmap(){
  var grade = state.student.grade;
  var pillars = computePillars();
  var weights = pillarWeights();

  var weakness = [];
  CONFIG.pillarOrder.forEach(function(p){
    if (p === "tests" && pillars[p] === null) return;
    var s = pillars[p];
    if (s === null || s === undefined) return;
    if (s < 50) weakness.push(p);
  });
  weakness.sort(function(a, b){ return pillars[a] - pillars[b]; });

  var byPeriod = {};
  PERIODS.forEach(function(p){ byPeriod[p.id] = []; });

  ROADMAP_TASKS.forEach(function(t){
    if (t.grades.indexOf(grade) === -1) return;
    if (t.weakOnly && weakness.indexOf(t.pillar) === -1) return;
    var task = Object.assign({}, t);
    task.done = !!state.roadmapDone[t.id];
    task.priority = (t.unscored || t.points <= 0)
      ? 0
      : (t.points / Math.max(t.hours, 0.1)) * periodUrgency(t.periods[0]);
    t.periods.forEach(function(p){ if (byPeriod[p]) byPeriod[p].push(task); });
  });

  PERIODS.forEach(function(p){
    byPeriod[p.id].sort(function(a, b){ return b.priority - a.priority; });
  });
  return { byPeriod: byPeriod, weakness: weakness, pillars: pillars, weights: weights };
}

function nextBestMove(){
  var rm = generateRoadmap();
  var deferred = state.deferredMove;
  var now = Date.now();
  var best = null;
  PERIODS.forEach(function(p){
    rm.byPeriod[p.id].forEach(function(t){
      if (t.done || t.points <= 0) return;
      if (deferred && deferred.id === t.id && deferred.until > now) return;
      if (!best || t.priority > best.priority) best = t;
    });
  });
  return best;
}

/* ------------------------------------------------------------
   LIVE DATES — countdown math. All computed from the real clock,
   so "in 12 days" is always true whenever the page is open.
   ------------------------------------------------------------ */
function parseLocalDate(iso){
  var p = String(iso).split("-");
  return new Date(+p[0], +p[1] - 1, +p[2]);
}
function startOfToday(){
  var n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}
function daysUntil(iso){
  return Math.round((parseLocalDate(iso) - startOfToday()) / 86400000);
}
function isoOf(d){
  var m = d.getMonth() + 1, day = d.getDate();
  return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (day < 10 ? "0" : "") + day;
}
function nextOccurrence(month1, day){
  var t = startOfToday();
  var d = new Date(t.getFullYear(), month1 - 1, day);
  if (d < t) d = new Date(t.getFullYear() + 1, month1 - 1, day);
  return d;
}
function fmtDate(iso){
  return parseLocalDate(iso).toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" });
}
function countdownText(iso){
  var d = daysUntil(iso);
  if (d > 1) return "in " + d + " days";
  if (d === 1) return "tomorrow";
  if (d === 0) return "today";
  if (d === -1) return "yesterday";
  return Math.abs(d) + " days ago";
}
/* Every date worth showing, sorted soonest-first, past dates dropped. */
function upcomingDates(limit, opts){
  opts = opts || {};
  var items = [];
  CONFIG.dates.milestones.forEach(function(m){
    var iso = isoOf(nextOccurrence(m.month, m.day));
    items.push({ kind:"milestone", id:m.id, label:m.label, date:iso, note:m.note });
  });
  if (!opts.milestonesOnly){
    [["sat","SAT", CONFIG.dates.sat], ["act","ACT", CONFIG.dates.act]].forEach(function(row){
      var key = row[0], name = row[1], list = row[2];
      list.forEach(function(t){
        if (daysUntil(t.reg) >= 0){
          items.push({ kind:key + "-reg", label:name + " registration deadline", date:t.reg,
            note:"for the " + fmtDate(t.test) + " test" });
        }
        if (daysUntil(t.test) >= 0){
          items.push({ kind:key + "-test", label:name + " test day", date:t.test,
            note: daysUntil(t.reg) >= 0 ? "Register by " + fmtDate(t.reg) : "Registration has closed" });
        }
      });
    });
  }
  items.sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  return typeof limit === "number" ? items.slice(0, limit) : items;
}

/* ------------------------------------------------------------
   REAL-TIME PROJECTION — compute what the score / fit WOULD be
   with a set of entries, without saving anything. Used by the
   add/edit impact box and the onboarding preview.
   ------------------------------------------------------------ */
function withState(entries, academics, fn){
  var prevE = state.entries, prevA = state.academics;
  state.entries = entries;
  if (academics) state.academics = academics;
  try { return fn(); } finally {
    state.entries = prevE;
    if (academics) state.academics = prevA;
  }
}
function draftProjection(){
  var d = state.draft;
  if (!d || !d.type) return null;
  var list = state.entries.filter(function(e){ return d.id === null || e.id !== d.id; });
  list = list.concat([d]);
  var before = computeStrength();
  var after = withState(list, null, function(){
    return { strength: computeStrength(), unis: computeUniversities() };
  });
  var beforeUnis = computeUniversities();
  var fits = beforeUnis.slice(0, 3).map(function(u, i){
    var a = after.unis.filter(function(x){ return x.id === u.id; })[0];
    return { name: u.name, before: u.fit, after: a ? a.fit : u.fit, rank: i + 1 };
  });
  return { before: before.score, after: after.strength.score, fits: fits };
}
/* Onboarding step-3 preview: what the profile would score with the
   academics + test scores typed so far. */
function onboardingProjection(){
  var s = state.student;
  var acad = {
    current: s.current || "", scale: s.scale || "percentage",
    previous: s.previous || "", rigourTaken: s.rigourTaken || "", rigourOffered: s.rigourOffered || ""
  };
  var sim = state.entries.slice();
  [["sat","SAT"],["act","ACT"],["ib","IB"],["ap","AP"]].forEach(function(pair){
    var val = (s[pair[0]] || "").trim();
    if (!val) return;
    if (sim.some(function(e){ return e.type === "test_score" && e.testName === pair[1]; })) return;
    sim.push({ id:"sim-" + pair[1], type:"test_score", testName:pair[1], scoreValue:val,
      level:"school", result:"", role:"member", hoursPerWeek:"", weeksPerYear:"",
      startDate:"", endDate:"", description:"", proofFile:"", themed:false, createdAt:Date.now() });
  });
  return withState(sim, acad, function(){ return computeStrength(); });
}

   DEMO STUDENT — "Aarav, Grade 10"

/* ------------------------------------------------------------
   LIVE DATA — clock, countdowns, dates card, Wikipedia summaries.
   Countdowns recompute from the real clock every minute; the
   clock text ticks every second so "live" is literally true.
   ------------------------------------------------------------ */
function clockText(){
  return new Date().toLocaleTimeString("en-US",
    { hour12:false, hour:"2-digit", minute:"2-digit", second:"2-digit" });
}
function agoText(ts){
  var mins = Math.round((Date.now() - ts) / 60000);
  if (mins < 2) return "just now";
  if (mins < 60) return mins + " min ago";
  var hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + (hrs === 1 ? " hour ago" : " hours ago");
  var days = Math.round(hrs / 24);
  return days + (days === 1 ? " day ago" : " days ago");
}
function shorten(text, n){
  if (!text || text.length <= n) return text || "";
  var cut = text.slice(0, n);
  var sp = cut.lastIndexOf(" ");
  return cut.slice(0, sp > 40 ? sp : n) + "…";
}
function tickClock(){
  var els = document.querySelectorAll(".live-clock");
  for (var i = 0; i < els.length; i++) els[i].textContent = clockText();
}
function tickLive(){
  var els = document.querySelectorAll("[data-cd]");
  for (var i = 0; i < els.length; i++){
    var iso = els[i].getAttribute("data-cd");
    els[i].textContent = countdownText(iso);
    els[i].classList.toggle("soon", daysUntil(iso) <= 7);
  }
}

}

/* Wikipedia live summaries — keyless, CORS-open, cached on device. */
var WIKI_TTL = 7 * 24 * 3600 * 1000;
var WIKI_REVALIDATE = 24 * 3600 * 1000;
function wikiKey(uni){ return "wiki." + uni.id; }
function wikiCacheGet(uni){
  var c = storeGet(wikiKey(uni));
  return (c && c.extract) ? c : null;
}
function fetchWikiRaw(uni, cb){
  if (typeof fetch !== "function") return cb(null, "unsupported");
  var done = false;
  var timer = setTimeout(function(){
    if (!done){ done = true; cb(null, "timeout"); }
  }, 8000);
  fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(uni.wiki))
    .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(j){
      if (done) return;
      done = true;
      clearTimeout(timer);
      var extract = (j.extract || "").trim();
      if (!extract) return cb(null, "empty");
      var data = {
        at: Date.now(),
        extract: extract,
        img: (j.thumbnail && j.thumbnail.source) || "",
        page: (j.content_urls && j.content_urls.desktop && j.content_urls.desktop.page) ||
              ("https://en.wikipedia.org/wiki/" + uni.wiki)
      };
      storeSet(wikiKey(uni), data);
      cb(data, null);
    })
    .catch(function(){
      if (done) return;
      done = true;
      clearTimeout(timer);
      cb(null, "network");
    });
}
function uniLiveInner(uni, data){
  var img = data.img
    ? '<img class="uni-live-img" src="' + esc(data.img) + '" alt="" loading="lazy">'
    : "";
  return '<div class="uni-live-body">' + img +
    '<div class="uni-live-text">' + esc(shorten(data.extract, 340)) + "</div></div>";
}
function uniLiveSrc(data, fresh){
  return '<div class="uni-live-src">' +
    '<span class="live-dot"><i></i>Live from Wikipedia · updated ' +
      (fresh ? "just now" : agoText(data.at)) + "</span>" +
    '<a href="' + esc(data.page) + '" target="_blank" rel="noopener">Read more' + "&nbsp;\u2197" + "</a>" +
  "</div>";
}
function patchUniLive(uni, data, fresh){
  var el = document.getElementById("uni-live");
  if (!el || el.getAttribute("data-uni") !== uni.id) return;
  el.innerHTML = uniLiveInner(uni, data) + uniLiveSrc(data, fresh);
}
function mountUniLive(id){
  var uni = CONFIG.universities.filter(function(u){ return u.id === id; })[0];
  if (!uni) return;
  var el = document.getElementById("uni-live");
  if (!el) return;
  var cached = wikiCacheGet(uni);
  if (cached){
    patchUniLive(uni, cached, false);
    if (Date.now() - cached.at < WIKI_REVALIDATE) return;
  }
  fetchWikiRaw(uni, function(data, err){
    if (data){ patchUniLive(uni, data, true); return; }
    var src = document.getElementById("uni-live-src");
    if (src){
      src.innerHTML = '<span class="live-dot off"><i></i>' +
        (err === "timeout" ? "Live fetch timed out" : "Offline — showing bundled summary") + "</span>";
    }
  });
}

function updateImpact(){
  var box = document.getElementById("impact-box");
  if (!box || !state.draft) return;
  var d = state.draft;
  var meta = CONFIG.typeMeta[d.type];
  if (!meta){
    box.innerHTML = '<h4>Estimated impact</h4><p class="impact-main">Pick an achievement type</p>' +
      '<p class="impact-sub">We\'ll show you how this changes your pillar score before you save.</p>';
    return;
  }
  var pillar = meta.pillar;
  var current = computePillars()[pillar];
  var before = (current === null || current === undefined) ? 0 : current;
  var withDraft = state.entries.filter(function(e){ return d.id === null || e.id !== d.id; }).concat([d]);
  var after;
  if (pillar === "academics"){
    after = academicsScore(withDraft);
    if (after === null) after = before;
  } else if (pillar === "tests"){
    after = Math.max(before, testPercentile(d) || before);
  } else {
    after = diminishingScore(entriesForPillar(pillar, withDraft), benchmarkFor(pillar));
  }
  after = Math.round(after);
  var beforeR = Math.round(before);
  var gain = after - beforeR;
  var label = CONFIG.pillarMeta[pillar].label;
  var sub;
  if (pillar === "academics" && beforeR === 0){
    sub = "Add your latest grade on the Academics page first — courses count on top of it.";
  } else if (gain > 0){
    sub = "That's +" + gain + " on this pillar. Profile strength moves too.";
  } else if (gain === 0){
    sub = "No change yet — add a level, result or hours to see it grow.";
  } else {
    sub = "Double-check the details — this entry looks weaker than what you already have.";
  }

  /* Real-time projection: overall strength + top-target fit,
     recalculated on every keystroke — nothing saved until you save. */
  var live = "";
  var proj = draftProjection();
  if (proj){
    var strengthChange = proj.after - proj.before;
    live += "<span>Profile strength <b>" + proj.before + " \u2192 " + proj.after + "</b>" +
      (strengthChange > 0 ? ' <em class="up" style="font-style:normal">+' + strengthChange + "</em>" : "") + "</span>";
    proj.fits.forEach(function(f){
      var delta = f.after - f.before;
      live += "<span>" + esc(f.name) + " fit <b>" + f.before + " \u2192 " + f.after + "</b>" +
        (delta > 0 ? ' <em class="up" style="font-style:normal">up a band</em>' :
         delta < 0 ? ' <em class="down" style="font-style:normal">down a band</em>' : "") + "</span>";
    });
  }

  box.innerHTML =
    '<h4>Estimated impact</h4>' +
    '<p class="impact-main">' + esc(label) + " pillar: " + beforeR + "% → " + after + "%</p>" +
    '<p class="impact-sub">' + sub + "</p>" +
    (live ? '<div class="impact-live" id="impact-live">' + live + "</div>" : "");
}

var NAV = [
  { hash:"#/home", label:"Home", icon:"home" },
  { hash:"#/profile", label:"Profile", icon:"user" },
  { hash:"#/chances", label:"Chances", icon:"target" },

  { hash:"#/settings", label:"Settings", icon:"gear" }
];

function parseHash(){
  var raw = (location.hash || "").replace(/^#/, "");
  if (!raw) raw = state.onboarded ? "/home" : "/onboarding";
  var qi = raw.indexOf("?");
  var query = "";
  if (qi >= 0){ query = raw.slice(qi + 1); raw = raw.slice(0, qi); }
  var parts = raw.split("/").filter(function(p){ return p.length; });
  var params = {};
  query.split("&").forEach(function(kv){
    if (!kv) return;
    var i = kv.indexOf("=");
    var k = i < 0 ? kv : kv.slice(0, i);
    var v = i < 0 ? "1" : decodeURIComponent(kv.slice(i + 1));
    params[decodeURIComponent(k)] = v;
  });
  return { parts: parts, params: params, path: raw };
}

function go(hash){ location.hash = hash; }

function activeNav(path){
  if (path.indexOf("/profile") === 0) return "#/profile";
  if (path.indexOf("/university") === 0) return "#/chances";
  if (path.indexOf("/add") === 0 || path.indexOf("/edit") === 0) return "#/profile";
  return "#" + path;
}

function shell(inner, opts){
  opts = opts || {};
  var r = parseHash();
  var current = activeNav(r.path);
  var navHtml = NAV.map(function(n){
    var on = n.hash === current;
    return '<a class="nav-link" href="' + n.hash + '"' + (on ? ' aria-current="page"' : "") + ">" +
      ic(n.icon) + "<span>" + n.label + "</span></a>";
  }).join("");
  var tabHtml = NAV.map(function(n){
    var on = n.hash === current;
    return '<a href="' + n.hash + '"' + (on ? ' aria-current="page"' : "") + ">" +
      ic(n.icon) + "<span>" + n.label + "</span></a>";
  }).join("");

  var strength = state.onboarded ? computeStrength() : null;
  var sideFoot = strength
    ? '<div class="side-foot"><p><b style="color:var(--ink);font-size:16px">' + strength.score +
      "/100</b> profile strength<br>" + esc(strength.label) + "</p></div>"
    : "";

  return '<div class="shell">' +
    '<aside class="sidebar">' +
      '<a class="brand" href="#/home"><span class="brand-mark">SA</span>' +
        '<span><b>Scholars Abroad</b><span>Ivy Profile Builder</span></span></a>' +
      navHtml + sideFoot +
    "</aside>" +
    '<div class="main"><main class="content" id="main">' + inner + "</main></div>" +
    '<nav class="tabbar" aria-label="Main">' + tabHtml + "</nav>" +
  "</div>";
}

var app;

function render(){
  var r = parseHash();

  if (!state.onboarded && r.parts[0] !== "onboarding"){
    location.replace("#/onboarding");
    return;
  }

  var html = "";
  var route = r.parts[0] || "home";
  var bare = false; // bare = no nav shell (onboarding)

  switch (route){
    case "onboarding": bare = true; html = viewOnboarding(r); break;
    case "home":       html = viewHome(); break;
    case "profile":    html = r.parts[1] ? viewPillar(r.parts[1]) : viewProfile(); break;
    case "add":        html = viewEntryForm(null, r.params.type); break;
    case "edit":       html = viewEntryForm(r.parts[1], null); break;
    case "chances":    html = viewChances(r.params.sort); break;
    case "university": html = viewUniversity(r.parts[1]); break;
    case "roadmap":    html = viewRoadmap(r.params.period); break;
    case "settings":   html = viewSettings(); break;
    default:
      html = viewNotFound();
  }

  app.innerHTML = bare ? html : shell(html);
  window.scrollTo(0, 0);
  if (route === "add" || route === "edit") updateImpact();
  if (route === "onboarding"){
    var obStep = r.params.step
      ? Math.max(1, Math.min(3, parseInt(r.params.step, 10) || 1))
      : (state.obStep || 1);
    if (obStep === 3) updateObLive();
  }
  if (route === "university") mountUniLive(r.parts[1]);
  tickLive();
  markTabBar();
}

function changeBadge(){
  var h = state.history;
  if (!h || h.length < 2) return "";
  var now = Date.now();
  var old = null;
  for (var i = 0; i < h.length; i++){
    if (now - h[i].t >= 20 * 24 * 3600 * 1000) old = h[i];
  }
  if (!old) return "";
  var diff = state.history[state.history.length - 1].score - old.score;
  if (diff >= 1) return '<span class="badge-change">+' + diff + " this month</span>";
  return "";
}

function ringSvg(score){
  var r = 86, c = 2 * Math.PI * r;
  var off = c * (1 - score / 100);
  return '<svg viewBox="0 0 200 200" role="img" aria-label="Profile strength ' + score + ' out of 100">' +
    '<circle cx="100" cy="100" r="' + r + '" fill="none" stroke="#E3E7EB" stroke-width="13"/>' +
    '<circle cx="100" cy="100" r="' + r + '" fill="none" stroke="#1D5A47" stroke-width="13" stroke-linecap="round" ' +
    'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) +
    '" transform="rotate(-90 100 100)" style="transition:stroke-dashoffset .4s ease"/>' +
    "</svg>";
}

function pillarStatusText(key, score){
  if (key === "academics"){
    if (score === null) return "Add your latest grade to score this pillar";
    return Math.round(score) + "% — " + (score >= 70 ? "strong academics" : score >= 50 ? "solid, keep it up" : "room to grow");
  }
  if (key === "tests"){
    if (score === null){
      var g = state.student.grade;
      if (g === "8" || g === "9" || g === "10") return "Not yet — that's normal at your grade";
      return "No test logged yet — add a practice score any time";
    }
    return Math.round(score) + "% — " + (score >= 75 ? "excellent result" : score >= 55 ? "good, a retake could lift it" : "consider preparing and retaking");
  }
  var n = entriesForPillar(key).length;
  if (n === 0){
    var empties = {
      activities: "No activities yet — clubs and volunteering count",
      awards: "No awards yet — even school-level ones count",
      projects: "No projects yet — anything you've built counts"
    };
    return empties[key] || "Add your first entry";
  }
  var word = score >= 75 ? "strong" : score >= 50 ? "solid" : score >= 25 ? "building" : "just starting";
  return n + (n === 1 ? " entry" : " entries") + " — " + word;
}

    "</div>" +
    '<div class="bar' + (weak ? " weak" : "") + '" style="margin-top:14px"><i style="width:' + (val === null ? 0 : val) + '%"></i></div>' +
    '<p class="tiny muted" style="margin-top:12px">' + esc(pillarExplain(pillar)) + "</p></div>";

  var body = "";
  if (pillar === "academics"){
    body = academicsForm() + entriesSection(pillar);
  } else if (pillar === "tests"){
    body = entriesSection(pillar);
  } else {
    body = entriesSection(pillar);
  }

  return head + '<div class="stack-lg">' + scoreBlock + body + "</div>" +
    '<div style="height:60px"></div>' +
    '<a class="fab" href="#/add?type=' + firstTypeForPillar(pillar) + '" aria-label="Add achievement">' +
    ic("plus") + "Add achievement</a>";
}

function pillarExplain(pillar){
  if (pillar === "academics") return "60% your grades (we convert your scale), 25% how hard your courses are, 15% whether your trend is going up.";
  if (pillar === "tests") return "Your best SAT/ACT/IB/AP result, converted to a percentile-style score. Skipped entirely in Grades 8–9.";
  return "Scored with diminishing returns: your best entry counts most, each next one counts 60% as much. Depth beats a long list.";
}

function firstTypeForPillar(pillar){
  var found = "competition";
  CONFIG.typeOrder.forEach(function(t){ if (CONFIG.typeMeta[t].pillar === pillar) found = t; });
  if (pillar === "activities") return "club";
  if (pillar === "projects") return "project";
  if (pillar === "tests") return "test_score";
  if (pillar === "academics") return "course";
  return found;
}

function entriesSection(pillar){
  var list = entriesForPillar(pillar);

      "<h4>" + esc(e.title) + "</h4><p>" + esc(e.body) + "</p>" +
      '<a class="btn btn-primary" href="' + e.href + '">' + esc(e.cta) + "</a></div>";

  var items = list.map(entryListItem).join("");
  return '<div class="card"><div class="row-between" style="margin-bottom:6px">' +
    '<h2 class="h3">Your entries (' + list.length + ")</h2>" +
    '<a class="link-btn" href="#/add?type=' + firstTypeForPillar(pillar) + '">' + ic("plus","ic-sm") + "Add</a></div>" +
    "<ul>" + items + "</ul></div>";
}

function resultOptions(type){
  if (type === "research") return [
    { id:"participation", label:"Assisted" },
    { id:"finalist", label:"Led it" },
    { id:"winner", label:"Published / presented" }
  ];
  if (type === "project") return [

    { id:"finalist", label:"Built & working" },
    { id:"winner", label:"In use by others" }
  ];
  return [
    { id:"participation", label:"Participation" },
    { id:"finalist", label:"Finalist / top 10%" },

  ];

function validateDraft(d){
  var ok = true;
  var errName = document.getElementById("err-name");
  var errType = document.getElementById("err-type");
  var errScore = document.getElementById("err-score");
  if (errName) errName.hidden = true;
  if (errType) errType.hidden = true;
  if (errScore) errScore.hidden = true;
  var nameInput = document.getElementById("f-name");
  if (nameInput) nameInput.classList.remove("bad");
  var scoreInput = document.getElementById("f-score");
  if (scoreInput) scoreInput.classList.remove("bad");

  if (!d.type){
    if (errType) errType.hidden = false;
    ok = false;
  }
  if (!d.name || !d.name.trim()){
    if (errName){ errName.hidden = false; }
    if (nameInput) nameInput.classList.add("bad");
    ok = false;
  }
  if (d.type === "test_score" && (d.scoreValue === "" || d.scoreValue === null || d.scoreValue === undefined)){
    if (errScore) errScore.hidden = false;
    if (scoreInput) scoreInput.classList.add("bad");
    ok = false;
  }
  return ok;
}

function pillarAction(pillar){
  var map = {
    academics:{ title:"Add your latest grades and list your advanced courses", hash:"#/profile/academics" },
    tests:{ title:"Take a practice SAT or ACT and log the score", hash:"#/add?type=test_score" },
    activities:{ title:"Take on a leadership role in one activity", hash:"#/add?type=club" },
    awards:{ title:"Enter one competition above school level", hash:"#/add?type=competition" },
    projects:{ title:"Start one project you can finish and show", hash:"#/add?type=project" }
  };
  return map[pillar] || map.activities;
}

function viewUniversity(id){
  var rows = computeUniversities();
  var row = rows.filter(function(r){ return r.id === id; })[0];
  if (!row) return viewNotFound();
  var uni = row.uni;
  var profile = computeStrength();
  var eff = emphasisFor(uni, profile.pillars);

  // strengths: real ones only — never call a 0% pillar a strength
  var scored = CONFIG.pillarOrder.filter(function(p){
    return profile.pillars[p] !== null && profile.pillars[p] !== undefined;
  });
  var strong = scored.filter(function(p){ return profile.pillars[p] >= 40; })
    .sort(function(a, b){
      return (profile.pillars[b] * eff[b]) - (profile.pillars[a] * eff[a]);
    });
  var byGap = scored.slice().sort(function(a, b){
    return (eff[b] * (100 - profile.pillars[b])) - (eff[a] * (100 - profile.pillars[a]));
  });

  var strengths = strong.slice(0, 2).map(function(p){
    return "<li>" + ic("check","ic-sm") + "<span><b>" + esc(CONFIG.pillarMeta[p].label) + "</b> at " +
      Math.round(profile.pillars[p]) + "% — " + esc(strengthPhrase(p, profile.pillars[p])) + "</span></li>";
  }).join("");
  if (!strengths){
    strengths = '<li>' + ic("info","ic-sm") +
      "<span>Nothing is scoring high enough to call a strength yet — your grades come closest. Add one activity or award to build the second one.</span></li>";
  } else if (strong.length < 2){
    strengths += '<li>' + ic("info","ic-sm") +
      "<span>Only one pillar is really working so far — a second strength makes your list read as a pattern, not a one-off.</span></li>";
  }

  var gaps = byGap.slice(0, 2).map(function(p, i){
    return "<li>" + ic("spark","ic-sm") + "<span><b>" + esc(CONFIG.pillarMeta[p].label) + "</b> at " +
      Math.round(profile.pillars[p]) + "% — " + esc(gapPhrase(p, profile.pillars[p], i)) + "</span></li>";
  }).join("") || '<li>' + ic("info","ic-sm") + "<span>No major gaps — keep deepening your strongest pillar.</span></li>";

  var actionPillars = byGap.slice(0, 2);
  if (actionPillars.length < 2){
    actionPillars = scored.slice().sort(function(a, b){ return (eff[b] || 0) - (eff[a] || 0); }).slice(0, 2);
  }
  var actions = actionPillars.map(function(p){
    var a = pillarAction(p);
    return '<a class="act-item" href="' + a.hash + '"><span class="grow">' + esc(a.title) + "</span>" + ic("chev","ic-sm") + "</a>";
  });
  actions.push('<a class="act-item" href="#/roadmap"><span class="grow">See all roadmap tasks for your weakest pillars</span>' + ic("chev","ic-sm") + "</a>");

  var why = row.fit >= 4
    ? "Your profile reaches " + row.fit + " of 5 — <b>Reach</b> territory. You're in range on what " + uni.name +
      " seems to weigh most. It's still a reach: admissions readers see essays, recommendations and context that this app never does."
    : "Your profile sits at " + row.fit + " of 5 — <b>High reach</b> right now. " + uni.name +
      " weights what's currently your lightest areas most heavily, so those are the moves that matter.";

  var emphasisBars = CONFIG.pillarOrder.map(function(p){
    var notYet = profile.pillars[p] === null || profile.pillars[p] === undefined;
    var pct = notYet ? 0 : Math.round((eff[p] || 0) * 100);
    return '<div class="bar-row"><div class="bar-label"><span>' + esc(CONFIG.pillarMeta[p].label) +
      '</span><span>' + (notYet ? "Not scored yet" : pct + "%") + "</span></div>" +
      '<div class="bar"><i style="width:' + pct + '%"></i></div></div>';
  }).join("");

  return '<div class="page-head">' +
      '<a class="icon-btn" href="#/chances" aria-label="Back to chances">' + ic("back") + "</a>" +
      '<div class="grow"><h1 class="h1">' + esc(uni.name) + "</h1>" +
      '<div class="row" style="margin-top:8px;gap:8px">' + bandChip(row.fit) + fitDots(row.fit) +
      '<span class="chip chip-grey">Rank #' + row.rank + "</span></div></div>" +
    "</div>" +
    '<div class="stack-lg">' +
      '<div class="card" id="uni-live" data-uni="' + uni.id + '">' +
        '<div class="row-between"><h3 class="h3">About ' + esc(uni.name) + "</h3></div>" +
        (function(){
          var cached = wikiCacheGet(uni);
          if (cached) return uniLiveInner(uni, cached) + uniLiveSrc(cached, false);
          return '<div class="uni-live-body"><div class="uni-live-text">' + esc(uni.blurb) +
            '<div class="skeleton"></div><div class="skeleton w60"></div></div></div>' +
            '<div class="uni-live-src" id="uni-live-src">' +
            '<span class="live-dot"><i></i>Fetching live summary from Wikipedia…</span></div>';
        })() +
      "</div>" +

      '<div class="why-card"><h4>Why this band</h4><p>' + why + "</p>" +
        '<p style="margin-top:10px;font-size:13.5px"><b>Biggest lever: ' +
        esc(CONFIG.pillarMeta[row.lever] ? CONFIG.pillarMeta[row.lever].label : "—") +
        "</b> — a realistic push there moves your fit here more than anything else.</p></div>" +

      uniDeadlinesHtml() +

      '<div class="grid-2">' +
        '<div class="card"><h3 class="h3">Your top 2 strengths</h3>' +
          '<ul class="strength-list" style="margin-top:8px">' + strengths + "</ul></div>" +
        '<div class="card"><h3 class="h3">Your top 2 gaps</h3>' +
          '<ul class="gap-list" style="margin-top:8px">' + gaps + "</ul></div>" +
      "</div>" +

      '<div class="stack"><h2 class="h2">3 moves that would most improve your fit</h2>' +
        '<div class="stack" style="gap:10px">' + actions.join("") + "</div></div>" +

      '<div class="card"><h3 class="h3">What ' + esc(uni.name) + ' seems to weigh</h3>' +
        '<div class="stack" style="gap:12px;margin-top:14px">' + emphasisBars + "</div>" +
        '<p class="tiny muted" style="margin-top:14px"><b>Placeholder weights.</b> Universities don\'t publish these numbers. ' +
        'Ours start from each school\'s Common Data Set factor rankings plus counsellor experience, and they live in an editable config so the Scholars Abroad team can correct them as evidence comes in.</p></div>' +

      '<div class="disclaimer">' + esc(uni.intlNote) + " <b>This app deliberately does not hard-code fast-changing rules.</b></div>" +
      '<div class="disclaimer"><b>Bands are estimates based on your profile.</b> Ivy admissions are holistic and unpredictable — treat every Ivy as a reach and build a balanced list.</div>' +
    "</div>";
}

function strengthPhrase(p, s){
  if (p === "academics") return s >= 70 ? "well above what they expect" : "a solid base to build on";
  if (p === "tests") return s >= 75 ? "a competitive score" : "a workable starting score";
  if (s >= 70) return "genuinely deep for your grade";
  if (s >= 50) return "a real strength in your list";
  return "your best-scoring pillar right now";
}
function gapPhrase(p, s){
  var specific = {
    academics: s < 40 ? "your grades are the fastest fix — add your latest result and advanced courses"
      : "good, but it's the heaviest slice of this school's weighting — keep it rising",
    tests: s < 40 ? "not logged yet — one practice SAT/ACT is the fastest fix"
      : "workable, but a retake would lift this school's fit the most",
    activities: s < 40 ? "your list is thin here — take on one bigger role in something you already do"
      : "building — depth in one activity would push this higher",
    awards: s < 40 ? "few results logged — enter one competition above school level"
      : "solid — a national-level result would move this school's fit",
    projects: s < 40 ? "nothing substantial built yet — start one small project you can show"
      : "building — one deeper, shipped project would strengthen this"
  };
  var base = specific[p] || (s < 40 ? "the lightest part of your profile right now" : "room to grow");
  return base;
}

/* ------------------------------------------------------------
   VIEW — Roadmap
   ------------------------------------------------------------ */
function viewRoadmap(periodId){
  var rm = generateRoadmap();
  var grade = state.student.grade;
  if (!periodId){
    periodId = (grade === "12" || grade === "ug") ? "application-year" : "this-term";
  }
  var available = PERIODS.filter(function(p){ return rm.byPeriod[p.id].length > 0; });
  if (!available.some(function(p){ return p.id === periodId; }) && available.length){
    periodId = available[0].id;
  }

  var tabs = PERIODS.map(function(p){
    var n = rm.byPeriod[p.id].length;
    return '<button data-action="roadmap-period" data-period="' + p.id + '" aria-pressed="' +
      (periodId === p.id) + '">' + esc(p.label) + (n ? " (" + n + ")" : "") + "</button>";
  }).join("");

  var tasks = rm.byPeriod[periodId] || [];
  var doneCount = tasks.filter(function(t){ return t.done; }).length;
  var pct = tasks.length ? Math.round((doneCount / tasks.length) * 100) : 0;

  var listHtml;
  if (!tasks.length){
    listHtml = '<div class="empty"><span class="pillar-icon">' + ic("map") + "</span>" +
      "<h4>Nothing scheduled here for your grade</h4>" +
      "<p>Try another period tab — or enjoy the quiet. Your profile keeps counting what you've already done.</p></div>";
  } else {
    listHtml = tasks.map(function(t){
      var meta = CONFIG.pillarMeta[t.pillar];
      var label = meta ? meta.label : (t.pillar === "essays" ? "Essays" : "Planning");
      var badge = t.unscored || t.points <= 0
        ? '<span class="chip chip-na">Doesn\'t change score — still essential</span>'
        : '<span class="chip chip-points">+' + t.points + " points</span>";
      return '<li class="task' + (t.done ? " done" : "") + '">' +
        '<button class="task-toggle" data-action="toggle-task" data-id="' + t.id +
          '" aria-pressed="' + t.done + '">' +
          '<span class="task-check">' + ic("check","ic-sm") + "</span>" +
          '<span class="task-body"><h4>' + esc(t.title) + "</h4>" +
            '<span class="task-meta"><span class="chip chip-grey">' + esc(label) + "</span>" +
            badge +
            '<span class="tiny muted" style="display:inline-flex;align-items:center;gap:4px">' +
            ic("clock","ic-sm") + esc(t.effort) + "</span></span>" +
          "</span></button></li>";
    }).join("");
    listHtml = '<ul class="stack" style="gap:10px">' + listHtml + "</ul>";
  }

  var weaknessNote = rm.weakness.length
    ? '<div class="disclaimer">Built from your grade (' +
      esc(grade === "ug" ? "UG" : "Grade " + grade) + "), your weakest pillars (" +
      esc(rm.weakness.map(function(p){ return CONFIG.pillarMeta[p].label; }).join(", ")) +
      ") and your intended major. Every task shows the points it's worth.</div>"
    : "";

  return '<div class="stack-lg">' +
    '<div class="page-head"><div class="grow">' +
      '<h1 class="h1">Your roadmap</h1>' +
      '<p class="muted" style="margin-top:6px">Small steps, in the right order for your grade.</p>' +
    "</div></div>" +
    '<div class="tabs" role="group" aria-label="Timeline period">' + tabs + "</div>" +
    datesCardHtml(6, { title:"Deadlines that matter" }) +
    '<div class="card"><div class="row-between"><span class="label">' + esc((PERIODS.filter(function(p){ return p.id === periodId; })[0] || {}).label || "") +
      '</span><span class="small muted">' + doneCount + " of " + tasks.length + " done</span></div>" +
      '<div class="progress" style="margin-top:10px"><i style="width:' + pct + '%"></i></div>' +
      (pct === 100 && tasks.length ? '<p class="small" style="margin-top:10px;color:var(--primary);font-weight:700">All done — nice work.</p>' : "") +
    "</div>" +
    listHtml +
    weaknessNote +
    '<div class="card" style="text-align:center;background:var(--tint);border:none">' +
      '<h3 class="h3">Want a human to check this?</h3>' +
      '<p class="small" style="margin-top:6px;color:#26564A">A Scholars Abroad counsellor can review your list and tell you what actually matters for your grade.</p>' +
      '<button class="btn btn-primary" style="margin-top:14px" data-action="open-counsellor">Talk to a counsellor</button>' +
    "</div>" +
  "</div>";
}
