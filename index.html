/* ------------------------------------------------------------
   Shared helpers for flow control
   ------------------------------------------------------------ */
var prevRoute = null;

function renderKeepFocus(sel){
  render();
  if (sel){
    var el = document.querySelector(sel);
    if (el && el.focus) el.focus();
  }
}

function recordHistory(){
  var score = computeStrength().score;
  var h = state.history;
  if (!h.length || Date.now() - h[h.length - 1].t > 12 * 3600 * 1000){
    h.push({ t: Date.now(), score: score });
  } else {
    h[h.length - 1] = { t: Date.now(), score: score };
  }
  if (h.length > 60) h.splice(0, h.length - 60);
}

function updateCounter(el){
  var c = document.getElementById("desc-counter");
  if (!c) return;
  var n = el.value.length;
  c.textContent = n + "/150";
  c.classList.toggle("over", n > 150);
}

function updateAcadScore(){
  var b = document.getElementById("acad-live-score");
  if (b){
    var s = computePillars().academics;
    b.textContent = s === null ? "not scored yet" : Math.round(s) + "/100";
  }
  var o = document.getElementById("acad-overall");
  if (o) o.textContent = computeStrength().score + "/100";
}
function updateObLive(){
  var box = document.getElementById("ob-live");
  if (!box) return;
  var s = state.student;
  var hasGrades = (s.current || "").trim() !== "";
  if (!hasGrades && !(s.sat || "").trim() && !(s.act || "").trim() &&
      !(s.ib || "").trim() && !(s.ap || "").trim()){
    box.innerHTML = '<h4>Live preview</h4><p class="impact-main">Your latest result goes here</p>' +
      '<p class="impact-sub">Type it in and we\'ll project your academics score and overall profile strength instantly — nothing is saved until you finish setup.</p>';
    return;
  }
  var proj = onboardingProjection();
  var acad = proj.pillars.academics;
  var tests = proj.pillars.tests;
  box.innerHTML =
    '<h4>Live preview</h4>' +
    '<p class="impact-main">Projected profile strength: ' + proj.score + "/100</p>" +
    '<p class="impact-sub">Academics ' + (acad === null ? "not scored yet" : Math.round(acad) + "/100") +
      " · Test scores " + (tests === null ? "not added yet" : Math.round(tests) + "/100") +
      " · " + esc(proj.label) + ". Recalculates as you type.</p>";
}

function goPrev(){
  go(prevRoute && prevRoute.indexOf("/add") !== 0 && prevRoute.indexOf("/edit") !== 0
    ? prevRoute : "#/profile");
}

function findTask(id){
  return ROADMAP_TASKS.filter(function(t){ return t.id === id; })[0] || null;
}

function taskHash(task){
  if (task.action.type) return task.action.hash + (task.action.hash.indexOf("?") >= 0 ? "&" : "?") + "type=" + task.action.type;
  return task.action.hash;
}

/* ------------------------------------------------------------
   Click delegation
   ------------------------------------------------------------ */
function onClick(e){
  var el = e.target.closest ? e.target.closest("[data-action]") : null;
  if (!el) return;
  var action = el.getAttribute("data-action");

  switch (action){
    /* ---- onboarding ---- */
    case "pick-grade":
      state.student.grade = el.getAttribute("data-grade");
      saveState();
      renderKeepFocus('[data-action="pick-grade"][data-grade="' + state.student.grade + '"]');
      break;

    case "pick-major":
      state.student.major = el.getAttribute("data-major");
      saveState();
      renderKeepFocus('[data-action="pick-major"][data-major="' + state.student.major.replace(/"/g, "&quot;") + '"]');
      break;

    case "pick-scale":
      state.student.scale = el.getAttribute("data-scale");
      state.academics.scale = state.student.scale;
      saveState();
      renderKeepFocus('[data-action="pick-scale"][data-scale="' + state.student.scale + '"]');
      break;

    case "ob-next":
      state.obStep = Math.min(3, (state.obStep || 1) + 1);
      saveState(); render();
      break;

    case "ob-back":
      state.obStep = Math.max(1, (state.obStep || 1) - 1);
      saveState(); render();
      break;

    case "ob-skip":
      state.obStep = 3;
      saveState(); render();
      toast("Skipping to the last step — just the essentials left.");
      break;

    case "ob-demo":
      loadDemo();
      go("#/home");
      toast("Demo loaded — this is Aarav, Grade 10. Reset anytime in Settings.");
      break;

    case "ob-finish":
      if (!state.consent){
        toast("A parent or guardian needs to agree before we save anything.");
        var box = document.querySelector(".consent input");
        if (box) box.focus();
        break;
      }
      finishOnboarding();
      break;

    /* ---- home ---- */
    case "move-do": {
      var task = findTask(el.getAttribute("data-id"));
      if (task) go(taskHash(task));
      break;
    }
    case "move-later":
      state.deferredMove = { id: el.getAttribute("data-id"), until: Date.now() + 7 * 24 * 3600 * 1000 };
      saveState(); render();
      toast("No problem — we'll bring you a different move for the next week.");
      break;

    /* ---- entries ---- */
    case "edit-entry":
      go("#/edit/" + el.getAttribute("data-id"));
      break;

    case "delete-entry": {
      var id = el.getAttribute("data-id");
      var entry = state.entries.filter(function(x){ return x.id === id; })[0];
      if (!entry) break;
      openModal(
        '<h3>Delete this entry?</h3>' +
        '<p class="muted" style="margin-top:10px">“' + esc(entry.name) + '” will be removed from your profile. This can\'t be undone.</p>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-ghost" data-action="close-modal">Keep it</button>' +
          '<button class="btn btn-danger" data-action="confirm-delete" data-id="' + id + '">Delete</button>' +
        "</div>"
      );
      break;
    }
    case "confirm-delete": {
      var did = el.getAttribute("data-id");
      var beforeS = computeStrength().score;
      state.entries = state.entries.filter(function(x){ return x.id !== did; });
      saveState();
      var afterS = computeStrength().score;
      recordHistory();
      closeModal(); render();
      var d2 = afterS - beforeS;
      toast(d2 < 0 ? "Entry removed — score adjusted to " + afterS + "." : "Entry removed.");
      break;
    }

    /* ---- entry form ---- */
    case "pick-type":
      state.draft.type = el.getAttribute("data-type");
      if (!state.draft.result && RESULT_TYPES.indexOf(state.draft.type) !== -1){
        state.draft.result = "participation";
      }
      saveState();
      renderKeepFocus('[data-action="pick-type"][data-type="' + state.draft.type + '"]');
      break;

    case "pick-level":
      state.draft.level = el.getAttribute("data-level");
      saveState();
      renderKeepFocus('[data-action="pick-level"][data-level="' + state.draft.level + '"]');
      break;

    case "pick-result":
      state.draft.result = el.getAttribute("data-result");
      saveState();
      renderKeepFocus('[data-action="pick-result"][data-result="' + state.draft.result + '"]');
      break;

    case "pick-role":
      state.draft.role = el.getAttribute("data-role");
      saveState();
      renderKeepFocus('[data-action="pick-role"][data-role="' + state.draft.role + '"]');
      break;

    case "pick-test":
      state.draft.testName = el.getAttribute("data-test");
      saveState();
      renderKeepFocus('[data-action="pick-test"][data-test="' + state.draft.testName + '"]');
      break;

    case "clear-proof":
      state.draft.proofFile = "";
      saveState(); render();
      break;

    case "save-entry":
      saveEntry();
      break;

    case "form-back":
      goPrev();
      break;

    /* ---- chances ---- */
    case "chances-sort":
      go("#/chances?sort=" + el.getAttribute("data-sort"));
      break;

    /* ---- roadmap ---- */
    case "roadmap-period":
      go("#/roadmap?period=" + el.getAttribute("data-period"));
      break;

    case "toggle-task": {
      var tid = el.getAttribute("data-id");
      var t = findTask(tid);
      var wasDone = !!state.roadmapDone[tid];
      if (wasDone) delete state.roadmapDone[tid];
      else state.roadmapDone[tid] = Date.now();
      saveState(); render();
      if (!wasDone && t){
        toast(t.unscored || t.points <= 0
          ? "Ticked off — this one doesn't move your score, but it matters."
          : "Nice work — that task is worth about +" + t.points + " once you log it.");
      }
      break;
    }

    case "open-counsellor":
      openModal(
        '<h3>Talk to a counsellor</h3>' +
        '<p class="muted small" style="margin-top:8px">Tell us where you are and we\'ll get back to you.</p>' +
        '<div class="stack">' +
          '<div class="field"><label for="cn-name">Your name</label>' +
            '<input class="input" id="cn-name" type="text" placeholder="e.g. Aarav" autocomplete="name"></div>' +
          '<div class="field"><label for="cn-contact">Email or phone</label>' +
            '<input class="input" id="cn-contact" type="text" placeholder="So we can reply" autocomplete="email"></div>' +
          '<div class="field"><label for="cn-msg">What do you need help with? <span class="muted" style="font-weight:600">— optional</span></label>' +
            '<textarea class="textarea" id="cn-msg" placeholder="e.g. I\'m in Grade 10 and unsure how to pick competitions."></textarea></div>' +
          '<p class="err" id="err-cn" hidden>Add your name and a way to reach you.</p>' +
        "</div>" +
        '<div class="modal-actions">' +
          '<button class="btn btn-ghost" data-action="close-modal">Cancel</button>' +
          '<button class="btn btn-primary" data-action="send-counsellor">Send</button>' +
        "</div>"
      );
      break;

    case "send-counsellor": {
      var n = (document.getElementById("cn-name") || {}).value || "";
      var c = (document.getElementById("cn-contact") || {}).value || "";
      if (!n.trim() || !c.trim()){
        var er = document.getElementById("err-cn");
        if (er) er.hidden = false;
        break;
      }
      openModal(
        '<div style="text-align:center;padding:8px 0">' +
          '<span class="pillar-icon" style="margin:0 auto 14px">' + ic("check") + "</span>" +
          "<h3>Message sent</h3>" +
          '<p class="muted" style="margin-top:10px">Thanks, ' + esc(n.trim().split(" ")[0]) +
          " — a Scholars Abroad counsellor will reply within 2 working days.</p>" +
          '<button class="btn btn-primary btn-block" style="margin-top:20px" data-action="close-modal">Done</button>' +
        "</div>"
      );
      break;
    }

    /* ---- settings ---- */
    case "export-data": {
      try {
        var payload = JSON.stringify({
          app: "Scholars Abroad – Ivy Profile Builder",
          version: CONFIG.version,
          exportedAt: new Date().toISOString(),
          note: "All data is stored locally on the device. Emphasis weights in CONFIG are placeholders pending calibration.",
          data: state
        }, null, 2);
        var blob = new Blob([payload], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "scholars-abroad-profile.json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
        toast("Exported — check your downloads.");
      } catch (err) {
        toast("Couldn't export in this browser.");
      }
      break;
    }

    case "refresh-live":
      CONFIG.universities.forEach(function(u){ storeDel(wikiKey(u)); });
      render();
      toast("Live summaries cleared — they'll refetch next time you open a school page.");
      break;

    case "chat-toggle":
      toggleChat();
      break;

    case "chat-close":
      closeChat();
      break;

    case "reset-data":
      openModal(
        '<h3>Reset everything?</h3>' +
        '<p class="muted" style="margin-top:10px">This deletes your profile, all entries and your roadmap progress from this device. It can\'t be undone.</p>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-ghost" data-action="close-modal">Keep my data</button>' +
          '<button class="btn btn-danger" data-action="confirm-reset">Reset everything</button>' +
        "</div>"
      );
      break;

    case "confirm-reset":
      storeDel(STORAGE_KEY);
      state = defaultState();
      prevRoute = null;
      closeModal();
      go("#/onboarding");
      render();
      toast("All cleared. Starting fresh.");
      break;

    /* ---- academics ---- */
    case "acad-scale":
      state.academics.scale = el.getAttribute("data-scale");
      saveState();
      renderKeepFocus('[data-action="acad-scale"][data-scale="' + state.academics.scale + '"]');
      break;

    /* ---- modal ---- */
    case "close-modal":
      closeModal();
      break;

    case "modal-backdrop":
      if (e.target === el) closeModal();
      break;
  }
}

function finishOnboarding(){
  var s = state.student;
  state.academics = {
    current: s.current || "",
    scale: s.scale || "percentage",
    previous: s.previous || "",
    rigourTaken: s.rigourTaken || "",
    rigourOffered: s.rigourOffered || ""
  };
  // Turn any test scores typed during onboarding into entries
  [["sat","SAT"],["act","ACT"],["ib","IB"],["ap","AP"]].forEach(function(pair){
    var val = (s[pair[0]] || "").trim();
    if (!val) return;
    var exists = state.entries.some(function(e){
      return e.type === "test_score" && e.testName === pair[1];
    });
    if (exists) return;
    state.entries.push({
      id: uid(), type: "test_score", name: pair[1] + " score",
      testName: pair[1], scoreValue: val,
      level: "school", result: "", role: "member",
      hoursPerWeek: "", weeksPerYear: "",
      startDate: "", endDate: "",
      description: "", proofFile: "", themed: false,
      createdAt: Date.now()
    });
  });
  state.onboarded = true;
  state.obStep = 1;
  saveState();
  recordHistory();
  go("#/home");
  var strength = computeStrength().score;
  toast("You're all set — profile strength " + strength + "/100. Add one achievement to move it.");
}

function saveEntry(){
  var d = state.draft;
  if (!d) { goPrev(); return; }
  if (!validateDraft(d)){
    toast("Just one small thing to fix before saving.");
    return;
  }
  if (d.description && d.description.length > 150){
    var counter = document.getElementById("desc-counter");
    if (counter) counter.classList.add("over");
    toast("Description is " + d.description.length + " characters — Common App allows 150.");
    return;
  }
  var before = computeStrength().score;
  var isNew = !d.id;
  if (isNew){
    d.id = uid();
    d.createdAt = Date.now();
    state.entries.push(JSON.parse(JSON.stringify(d)));
  } else {
    var idx = -1;
    state.entries.forEach(function(x, i){ if (x.id === d.id) idx = i; });
    if (idx >= 0) state.entries[idx] = JSON.parse(JSON.stringify(d));
  }
  state.draft = null;
  saveState();
  var after = computeStrength().score;
  recordHistory();
  var diff = after - before;
  toast(isNew
    ? (diff > 0 ? "Saved — profile strength +" + diff + ". Nice work." : "Saved.")
    : "Changes saved — profile strength " + after + "/100.");
  goPrev();
}

/* ------------------------------------------------------------
   Field binding (typing never triggers a full re-render)
   ------------------------------------------------------------ */
function onField(e){
  var el = e.target;
  if (!el || !el.getAttribute) return;
  var f = el.getAttribute("data-field");
  if (!f) return;
  if (el.type === "file"){
    if (el.getAttribute("data-action") === "proof-file" && state.draft){
      var file = el.files && el.files[0];
      if (file){
        state.draft.proofFile = file.name;
        saveState(); render();
        toast("Attached " + file.name + " — only the name is stored.");
      }
    }
    return;
  }
  var val = el.type === "checkbox" ? el.checked : el.value;

  if (f.indexOf("draft.") === 0){
    if (!state.draft) return;
    state.draft[f.slice(6)] = val;
    if (f === "draft.name"){
      el.classList.remove("bad");
      var en = document.getElementById("err-name");
      if (en) en.hidden = true;
    }
    if (f === "draft.scoreValue"){
      el.classList.remove("bad");
      var es = document.getElementById("err-score");
      if (es) es.hidden = true;
    }
  } else if (f.indexOf("student.") === 0){
    state.student[f.slice(8)] = val;
    if (f === "student.scale") state.academics.scale = val;
  } else if (f.indexOf("academics.") === 0){
    state.academics[f.slice(10)] = val;
  } else if (f === "consent"){
    state.consent = val;
  }
  saveState();

  if (el.id === "f-desc") updateCounter(el);
  if (f.indexOf("draft.") === 0) updateImpact();
  if (f.indexOf("academics.") === 0) updateAcadScore();
  if (f.indexOf("student.") === 0) updateObLive();
  if (f === "student.grade" && el.tagName === "SELECT") render();
}

/* ------------------------------------------------------------
   SCHOLARAI CHAT — talks to the backend at /api/chat, which
   holds the Groq key. The browser never sees the key.
   ------------------------------------------------------------ */
var chatHistory = [];
var chatBusy = false;
var chatWelcomed = false;

function chatContext(){
  if (!state.onboarded) return null;
  try {
    var p = computeStrength();
    var rows = computeUniversities().slice(0, 3);
    var move = nextBestMove();
    return {
      name: state.student.name || "",
      grade: state.student.grade === "ug" ? "Undergraduate" : "Grade " + state.student.grade,
      major: state.student.major || "",
      score: p.score,
      label: p.label,
      pillars: CONFIG.pillarOrder.map(function(k){
        var s = p.pillars[k];
        return CONFIG.pillarMeta[k].label + ": " + (s === null ? "not yet" : Math.round(s) + "%");
      }).join(", "),
      topTargets: rows.map(function(r){ return r.name + " (fit " + r.fit + "/5)"; }).join(", "),
      nextMove: move ? move.title : ""
    };
  } catch (e){ return null; }
}
function escChat(s){
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function mdInline(s){
  return s
    .replace(/`([^`]+)`/g, function(m, c){ return '<code class="chat-code">' + c + "</code>"; })
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
}

function mdTableHtml(rows){
  var cells = rows.map(function(r){
    return r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function(c){ return c.trim(); });
  });
  var head = cells[0];
  var body = cells.slice(1).filter(function(r){
    return !r.every(function(c){ return /^:?-{2,}:?$/.test(c); });
  });
  var h = '<table class="chat-table"><thead><tr>';
  head.forEach(function(c){ h += "<th>" + mdInline(escChat(c)) + "</th>"; });
  h += "</tr></thead><tbody>";
  body.forEach(function(r){
    h += "<tr>";
    r.forEach(function(c){ h += "<td>" + mdInline(escChat(c)) + "</td>"; });
    h += "</tr>";
  });
  return h + "</tbody></table>";
}
function mdToHtml(text){
  try {
    var lines = String(text).split(/\r?\n/);
    var out = [], i = 0;
    while (i < lines.length){
      var line = lines[i];
      if (/^\s*\|.*\|\s*$/.test(line)){
        var rows = [];
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){ rows.push(lines[i]); i++; }
        out.push(mdTableHtml(rows));
        continue;
      }
      if (/^#{1,4}\s+/.test(line)){
        out.push('<div class="chat-h">' + mdInline(escChat(line.replace(/^#{1,4}\s+/, ""))) + "</div>");
        i++; continue;
      }
      if (/^\s*[-*•]\s+/.test(line)){
        var items = [];
        while (i < lines.length && /^\s*[-*•]\s+/.test(lines[i])){
          items.push(mdInline(escChat(lines[i].replace(/^\s*[-*•]\s+/, ""))));
          i++;
        }
        out.push('<ul class="chat-ul">' + items.map(function(x){ return "<li>" + x + "</li>"; }).join("") + "</ul>");
        continue;
      }
      if (/^\s*\d+\.\s+/.test(line)){
        var nums = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])){
          nums.push(mdInline(escChat(lines[i].replace(/^\s*\d+\.\s+/, ""))));
          i++;
        }
        out.push('<ol class="chat-ul">' + nums.map(function(x){ return "<li>" + x + "</li>"; }).join("") + "</ol>");
        continue;
      }
      if (line.trim() === ""){ i++; continue; }
      var para = [line];
      i++;
      while (i < lines.length && lines[i].trim() !== "" &&
             !/^\s*([-*•]\s+|\d+\.\s+|#{1,4}\s+|\|)/.test(lines[i])){
        para.push(lines[i]); i++;
      }
      out.push("<p>" + mdInline(escChat(para.join(" "))) + "</p>");
    }
    return out.join("");
  } catch (e){ return escChat(text); }
}

function chatEl(id){ return document.getElementById(id); }
function chatScroll(){
  var box = chatEl("chat-msgs");
  if (box) box.scrollTop = box.scrollHeight;
}
function chatBubble(role, content){
  var box = chatEl("chat-msgs");
  if (!box) return null;
  var el = document.createElement("div");
  el.className = "chat-bubble " + (role === "user" ? "user" : "bot");
  if (role === "user") el.textContent = content;
  else el.innerHTML = mdToHtml(content);
  box.appendChild(el);
  chatScroll();
  return el;
}
function chatTyping(on){
  var box = chatEl("chat-msgs");
  if (!box) return;
  var old = box.querySelector(".chat-typing");
  if (old) old.remove();
  if (on){
    var t = document.createElement("div");
    t.className = "chat-typing";
    t.innerHTML = "<i></i><i></i><i></i>";
    t.setAttribute("aria-label", "ScholarAI is typing");
    box.appendChild(t);
    chatScroll();
  }
}
function chatSetStatus(text, ok){
  var el = chatEl("chat-status");
  if (el) el.textContent = text;
  var badge = chatEl("chat-badge");
  if (badge){ badge.hidden = false; badge.className = "chat-badge" + (ok ? "" : " off"); }
}
async function chatHealth(){
  try {
    var res = await fetch("/api/health", { cache: "no-store" });
    var h = await res.json();
    if (h && h.chat) chatSetStatus("online · " + h.model, true);
    else if (h) chatSetStatus("server up · chat key missing", false);
    else chatSetStatus("offline", false);
  } catch (e){
    if (location.protocol === "file:"){
      chatSetStatus("offline · run npm start", false);
    } else {
      chatSetStatus("offline", false);
    }
  }
}
function chatWelcome(){
  if (chatWelcomed) return;
  chatWelcomed = true;
  var first = state.onboarded
    ? "Hi — I'm **ScholarAI**, your study-abroad mentor. I can see your Scholars Abroad profile, so ask me anything: university shortlists, SOPs, scholarships, tests, visas or timelines. What's on your mind?"
    : "Hi — I'm **ScholarAI**, your study-abroad mentor. Ask me about universities, countries, scholarships, SOPs, tests or visas — I'll keep answers practical and honest.";
  chatBubble("bot", first);
}
function openChat(){
  var panel = chatEl("chat-panel");
  var fab = chatEl("chat-fab");
  if (!panel) return;
  panel.hidden = false;
  if (fab) fab.setAttribute("aria-expanded", "true");
  chatWelcome();
  chatHealth();
  var input = chatEl("chat-input");
  if (input) input.focus();
}
function closeChat(){
  var panel = chatEl("chat-panel");
  var fab = chatEl("chat-fab");
  if (panel) panel.hidden = true;
  if (fab) fab.setAttribute("aria-expanded", "false");
}
function toggleChat(){
  var panel = chatEl("chat-panel");
  if (!panel) return;
  if (panel.hidden) openChat(); else closeChat();
}
function chatFail(message){
  chatBubble("bot", message);
}
async function chatSend(){
  var input = chatEl("chat-input");
  if (!input || chatBusy) return;
  var text = input.value.trim();
  if (!text) return;
  if (text.length > 2000) text = text.slice(0, 2000);

  chatBubble("user", text);
  chatHistory.push({ role: "user", content: text });
  input.value = "";
  input.style.height = "auto";

  chatBusy = true;
  var send = chatEl("chat-send");
  if (send) send.disabled = true;
  chatTyping(true);

  try {
    var res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: text,
        context: chatContext(),
        history: chatHistory.slice(0, -1).slice(-10)
      })
    });
    var data = null;
    try { data = await res.json(); } catch (e){ data = null; }
    chatTyping(false);
    if (!res.ok || !data || !data.reply){
      var why = data && data.error ? data.error : "Request failed (" + res.status + ").";
      chatFail(why);
    } else {
      chatBubble("bot", data.reply);
      chatHistory.push({ role: "assistant", content: data.reply });
    }
  } catch (e){
    chatTyping(false);
    chatFail("I can't reach the app server. If you opened index.html directly (file://), stop it and run `npm start`, then open http://localhost:3000 — I'll come online there.");
  } finally {
    chatBusy = false;
    if (send) send.disabled = false;
    if (input) input.focus();
    chatHealth();
  }
}
function wireChat(){
  var form = chatEl("chat-form");
  var input = chatEl("chat-input");
  if (form) form.addEventListener("submit", function(ev){
    ev.preventDefault();
    chatSend();
  });
  if (input){
    input.addEventListener("keydown", function(ev){
      if (ev.key === "Enter" && !ev.shiftKey){
        ev.preventDefault();
        chatSend();
      }
    });
    input.addEventListener("input", function(){
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 110) + "px";
    });
  }
}

/* ------------------------------------------------------------
   INIT
   ------------------------------------------------------------ */
function init(){
  app = document.getElementById("app");
  loadState();

  window.addEventListener("hashchange", function(){
    var r = parseHash();
    var route = r.parts[0] || (state.onboarded ? "home" : "onboarding");
    if (route !== "add" && route !== "edit") prevRoute = location.hash;
    render();
  });
  document.addEventListener("click", onClick);
  document.addEventListener("input", onField);
  document.addEventListener("change", onField);
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape"){
      var panel = document.getElementById("chat-panel");
      if (document.querySelector(".modal-backdrop")) closeModal();
      else if (panel && !panel.hidden) closeChat();
    }
  });
  wireChat();

  if (!location.hash){
    location.replace(state.onboarded ? "#/home" : "#/onboarding");
  }
  var r0 = parseHash();
  var route0 = r0.parts[0] || (state.onboarded ? "home" : "onboarding");
  if (route0 !== "add" && route0 !== "edit") prevRoute = location.hash;
  render();

  /* Real-time loops: ticking clock + countdown refresh. Cheap DOM
     queries only; nothing runs when the elements aren't on screen. */
  setInterval(tickClock, 1000);
  setInterval(tickLive, 60000);
  window.addEventListener("focus", function(){ tickClock(); tickLive(); });
}

init();
